<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Count X</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Count X</h1>
    <p class="subtitle">Upload a photo of a grid of boxes. It finds every box and counts the ones with an X automatically — no setup.</p>
  </header>

  <main>
    <section class="panel">
      <div id="status" class="status">Loading OpenCV&hellip;</div>

      <div class="controls-row">
        <label class="file-label">
          <input type="file" id="fileInput" accept="image/*" />
          <span>Choose photo</span>
        </label>
        <button id="resetBtn" class="btn btn-ghost" disabled>Reset</button>
      </div>

      <div class="canvas-wrap" id="canvasWrap" hidden>
        <canvas id="viewCanvas"></canvas>
      </div>

      <div id="resultsSection" hidden>
        <div class="controls-row">
          <label class="threshold-label">
            Mark sensitivity
            <input type="range" id="thresholdSlider" min="1" max="40" value="7" />
            <span id="thresholdValue">7%</span>
          </label>
        </div>
        <div id="totalResult" class="total-result"></div>
        <p id="detectedNote" class="hint"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>Runs entirely in your browser &mdash; nothing is uploaded anywhere.</p>
  </footer>

  <script>
    // opencv.js looks for a pre-existing Module config; onRuntimeInitialized
    // fires once the WASM is actually compiled and ready, unlike the script
    // tag's own onload (which fires as soon as the JS wrapper downloads).
    var Module = {
      onRuntimeInitialized() {
        window.dispatchEvent(new Event("opencv-ready"));
      }
    };
  </script>
  <script async src="https://docs.opencv.org/4.9.0/opencv.js"></script>
  <script src="app.js"></script>
</body>
</html>
